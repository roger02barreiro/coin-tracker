<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador de monedas eFootball</title>
<link rel="manifest" href="manifest.json">
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  background: #1e293b;
  padding: 20px;
  border-radius: 20px;
  width: 430px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
.balance { font-size: 3em; color: #38bdf8; }
.stats { font-size: 0.85em; margin: 10px 0; opacity: 0.8; }
button, input, select {
  margin: 5px; padding: 8px; border-radius: 10px; border: none;
}
button { cursor: pointer; font-weight: bold; }
.add { background: #22c55e; }
.reset { background: #ef4444; }
.history {
  margin-top: 10px;
  max-height: 120px;
  overflow-y: auto;
  background: #020617;
  padding: 8px;
  border-radius: 10px;
  font-size: 0.8em;
}
</style>
</head>
<body>

<div class="container">
  <h2>🔥 Contador de monedas eFootball 🔥</h2>

  <div id="balance" class="balance">0</div>

  <div class="stats" id="stats"></div>

  <input type="number" id="amount" placeholder="Cantidad">
  <select id="type">
    <option value="gain">Ganancia</option>
    <option value="spend">Gasto</option>
  </select>

  <div>
    <button class="add" onclick="handleCoins()">Aplicar</button>
    <button class="reset" onclick="resetAll()">Reset</button>
  </div>

  <div class="history" id="history"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || {
  balance: 0,
  history: [],
  lastDay: null,
  streak: 0,
  record: 0
};

function save() {
  localStorage.setItem("data", JSON.stringify(data));
  updateUI();
}

function handleCoins() {
  const amount = parseInt(document.getElementById("amount").value);
  const type = document.getElementById("type").value;
  if (!amount) return;

  const today = new Date().toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });

  if (data.lastDay !== today) {
    data.streak++;
    data.lastDay = today;
  }

  if (type === "gain") data.balance += amount;
  else data.balance -= amount;

  data.history.push({ date: today, type, amount, balance: data.balance });

  if (data.balance > data.record) data.record = data.balance;

  save();
}

function getStats() {
  // formato español ya aplicado en fechas
  let gain = 0, spend = 0;

  data.history.forEach(h => {
    if (h.type === 'gain') gain += h.amount;
    else spend += h.amount;
  });

  const days = [...new Set(data.history.map(h => h.date))].length || 1;
  const avg = Math.floor(gain / days);

  return { gain, spend, avg };
}

function updateUI() {
  document.getElementById("balance").innerText = data.balance;

  const s = getStats();

  document.getElementById("stats").innerHTML = `
    🔥 Racha: ${data.streak} días<br>
    🏆 Récord: ${data.record}<br>
    📈 Ganado: ${s.gain} | Gastado: ${s.spend}<br>
    🧠 Promedio diario: ${s.avg}
  `;

  const historyDiv = document.getElementById("history");
  historyDiv.innerHTML = "";

  data.history.slice().reverse().forEach(h => {
    const div = document.createElement("div");
    div.innerText = `${h.date} - ${h.type} ${h.amount} → ${h.balance}`;
    historyDiv.appendChild(div);
  });
}

function resetAll() {
  if (!confirm("¿Seguro?")) return;
  localStorage.clear();
  location.reload();
}

updateUI();
</script>

</body>
</html>
